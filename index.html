<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="card">
      <img src="./assets/images/illustration-article.svg" alt="" class="card__image" />

      <section class="card__content">
        <p class="card__category">Learning</p>
        <p class="card__published">
          Published
          <time datetime="2023-12-21" class="card__date">21 Dec 2023</time>
        </p>
        <h1 class="card__title"><a href="#" class="card__title-link">HTML & CSS foundations</a></h1>
        <p class="card__details">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </section>
      <footer class="card__footer">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="card__author-image" />
        <p class="card__author-name">Greg Hooper</p>
      </footer>
    </article>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>
      . Coded by
      <a href="#">Alex R. Farnes</a>
      .
    </footer>
  </body>
</html>
